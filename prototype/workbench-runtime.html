<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>伊雍历史工作台</title>
  <style>
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #080d0d; }
    [data-eyon-workbench-shell] { display: block; width: 100%; height: 100%; min-height: 0; }
    [data-eyon-workbench-reopen] {
      position: fixed; right: 16px; bottom: 16px; z-index: 1000;
      display: none;
      min-height: 42px; border: 1px solid #52b8ad; border-radius: 5px;
      padding: 0 14px; color: #f1eee5; background: #0d1313; cursor: pointer;
    }
  </style>
</head>
<body>
  <main data-eyon-workbench-shell data-preview-source="production-bundle"></main>
  <button type="button" data-eyon-workbench-reopen>打开伊雍工作台</button>
  <script>
    const previewParams = new URLSearchParams(location.search);
    const previewOption = (key, values, fallback) => {
      const value = previewParams.get(key);
      return values.includes(value) ? value : fallback;
    };
    const settings = {
      schemaVersion: 1,
      generation: {
        genealogy: { apiurl: '', key: '', model: '', source: 'openai', maxTokens: 60000, temperature: 0.8 },
        ruin: { apiurl: '', key: '', model: '', source: 'openai', maxTokens: 60000, temperature: 0.8 },
        biography: { apiurl: '', key: '', model: '', source: 'openai', maxTokens: 60000, temperature: 0.8 },
        butterfly: { apiurl: '', key: '', model: '', source: 'openai', maxTokens: 60000, temperature: 0.8 },
      },
      ruinDraft: null,
      retries: { genealogy: 2, ruin: 2, biography: 2, butterfly: 2 },
      retrieval: { biographyEnabled: false, worldbookScope: 'eyon', mergeAliases: true, worldbookEntryExclusions: {} },
      ruinPreferences: { candidateCount: 3 },
      errorLog: [],
      genealogyDepth: { ancestors: 4, descendants: 3, maxPerGeneration: 7 },
      appearance: {
        mode: previewOption('mode', ['light', 'dark'], 'light'),
        accent: previewOption('accent', ['jade', 'gold', 'blue', 'crimson'], 'jade'),
        text: previewOption('text', ['neutral', 'warm', 'cool'], 'neutral'),
      },
    };
    const character = {
      mvuId: '维奥莱塔·马克西姆·奥古斯塔',
      name: '维奥莱塔·马克西姆·奥古斯塔',
      aliases: ['铁血女皇'],
      race: '人类',
      identities: ['奥古斯提姆帝国女皇'],
      professions: ['统治者', '神话战士'],
      lifeLevel: '第六层级',
    };
    const runtime = {
      flowState: 'idle',
      runId: '',
      realityTime: '复兴纪元488年-风信之月(3月)-15日-14:09',
      realityLocation: '奥古斯提姆帝国-金谷城近郊-布劳尔子爵城堡',
      ruinTime: '',
      ruinLocation: '',
    };
    const previewBiographyRecords = [{
      key: 'preview::biography::dusk-tide-notebook',
      namespace: { characterKey: 'preview', chatId: 'preview-chat' },
      biographyId: 'dusk-tide-notebook',
      requestId: 'preview-biography-131',
      triggerMessageId: 1,
      assistantMessageId: 2,
      sourceHash: 'preview',
      status: 'committed',
      revision: 1,
      biography: {
        schema: 'eyon.biography.v1',
        requestId: 'preview-biography-131',
        playerDirective: {
          raw: '追溯《暮潮手札》的流转',
          interpretedTarget: '暮潮手札',
          hardTimeScope: '复兴纪元475年至488年',
          primaryDirection: '手札在战乱与港口间的流转',
          secondaryInterests: ['水文', '外港'],
          reconciliation: '',
        },
        target: {
          type: 'object',
          name: '暮潮手札',
          aliases: ['泥潮行录'],
          sourceRefs: ['preview-worldbook'],
        },
        presentation: {
          title: '暮潮手札·雾港残卷',
          subtitle: '盐雾、兵燹与两代测绘者留下的水脉证词',
        },
        span: {
          mode: 'calendar',
          start: { year: 475, month: 3, day: null, hour: null, age: null, era: '复兴纪元' },
          end: { year: 488, month: 3, day: null, hour: null, age: null, era: '复兴纪元' },
          label: '复兴纪元475年3月 - 488年3月',
        },
        origin: {
          title: '起源（复兴纪元475年3月）',
          content: '南境旧水道春汛倒灌，老领航员费恩将第一笔异常潮位写入防潮羊皮册。',
          sourceRefs: ['preview-worldbook'],
          inference: false,
        },
        stages: [
          ['watergate', 'turbulent', '水门兵燹与残卷逃亡', '复兴纪元476年 - 478年', '旧水门在兵火中陷落，洛安从潮湿瓦砾下抢救出残卷。'],
          ['dry-river', 'transition', '涸谷干滩的旧图新注', '复兴纪元479年 - 481年', '旧航图在旱季显露出另一种意义，手札由记录变成求生的路标。'],
          ['blackwater', 'stable', '黑水驿栈的私怨横祸', '复兴纪元481年 - 484年', '失窃与典押令手札沉入柴房，也留下难以抹去的市井痕迹。'],
          ['handover', 'transition', '外港秋雾与暮潮移交', '复兴纪元485年8月 - 11月', '洛安在第七泊位将手札交给弥拉，交接年份却留下两套证词。'],
          ['oath', 'stable', '潮音神龛的定历誓约', '复兴纪元485年 - 487年', '弥拉以实测潮痕校正旧历，残卷由私人物证成为公共尺度。'],
        ].map(([id, type, title, span, content]) => ({
          id,
          type,
          title,
          span,
          diceMaterial: '史料流转',
          content,
          introduced: [],
          people: ['费恩', '洛安', '弥拉'],
          factions: ['外港学派'],
          objects: ['暮潮手札'],
          locations: ['艾瑟嘉德外港'],
          sourceRefs: ['preview-worldbook'],
          biographyUsage: [],
          inference: true,
        })),
        status: {
          title: '现状（复兴纪元488年3月）',
          content: '手札现存于观潮阁双锁防潮匣，仍是外港学徒校正潮汐时必须查阅的原始尺度。',
          sourceRefs: ['preview-worldbook'],
          inference: true,
        },
        summary: '一册水文手札在战火、荒滩与港口之间辗转，最终成为保存异说与实测证据的王庭典藏。',
        indexes: {
          people: ['费恩', '洛安', '弥拉'],
          factions: ['外港学派'],
          objects: ['暮潮手札'],
          locations: ['南境旧水道', '艾瑟嘉德外港'],
          themes: ['水文', '史料流转', '冲突证词'],
          potentialRuinLinks: ['暮潮移交'],
        },
        rootTrace: '[Preview RootTrace]',
        qualityChecks: {
          playerDirectionFulfilled: true,
          hardTimeScopeRespected: true,
          worldbookConsistent: true,
          diceIntegratedWithoutHijacking: true,
          existingBiographiesUsedResponsibly: true,
          rootTraceMatchesStructuredData: true,
        },
      },
      createdAt: 1,
      updatedAt: 1,
    }];
    // Explicit query-only fixtures: the default preview and real host remain untouched.
    const lineage = previewOption('lineage', ['creation', 'possession', 'cross-world-travel'], '');
    const date = (year, label, status = year === null ? 'unknown' : 'known', era = year === null ? '' : '复兴纪元') =>
      ({ status, era, year, month: null, day: null, precision: year === null ? 'unknown' : 'exact', label });
    const previewGenealogies = [];
    if (lineage) {
      Object.assign(character, { mvuId: 'preview-special-person', name: lineage === 'creation' ? '艾琳一号' : '归来的见证者',
        race: lineage === 'creation' ? '构装体' : '人类', identities: ['王庭档案管理员'], professions: ['档案整理员'], lifeLevel: '第二层级' });
      const node = (id, name, generation, relation, focus = false) => ({
        id, name, generation, relationToFocus: relation, isFocus: focus, mvuId: focus ? character.mvuId : '', aliases: [],
        isMvuCharacter: focus, viewable: true, canInjectToRuin: true, provenance: 'generated',
        birth: date(464, '复兴纪元464年'), death: date(null, '在世', 'alive'), race: focus ? character.race : '人类',
        identities: [focus ? '王庭档案管理员' : relation], professions: ['档案整理员'], lifeLevel: '',
        summary: '守护珍贵的记录。', profile: { personality: '安静认真，习惯反复确认每一份记录。',
          lifeExperience: focus ? '来到王庭后，将各地散佚的档案重新编目。' : '与王庭档案保存工作结下长久因缘。' }, sourceRefs: [], historyRefs: [],
      });
      const edge = (id, from, to, relationType, label, track) => ({ id, from, to, relationType, label, track, sourceRefs: [] });
      const nodes = [node('focus', character.name, 0, '本人', true)], edges = [];
      if (lineage === 'creation') {
        nodes[0].identity = { lineageKind: lineage, activation: date(485, '复兴纪元485年') };
        nodes.push(node('creator', '工匠罗森', -1, '创造者'), node('owner', '档案馆长', 0, '主人'), node('previous', '艾琳零号', -1, '前代个体'));
        edges.push(edge('creator', 'creator', 'focus', 'creator', '创造者', 'creation'),
          edge('owner', 'owner', 'focus', 'owner', '主人', 'social'), edge('previous', 'previous', 'focus', 'predecessor', '前代个体', 'creation'));
        nodes[2].professions = ['王庭档案馆长']; nodes[3].race = '构装体';
        nodes[3].identity = { lineageKind: 'creation', activation: date(480, '复兴纪元480年') };
      } else if (lineage === 'possession') {
        nodes[0].identity = { lineageKind: lineage, body: { birth: nodes[0].birth },
          soul: { name: '远行的抄书人', world: '原界', birth: date(null, '原界幼年'), death: date(null, '去向不详') },
          incarnation: date(487, '复兴纪元487年') };
        nodes.push(node('body-parent', '宿主父亲', -1, '父亲'), node('origin-parent', '原界母亲', -1, '原身份母亲'));
        nodes[1].birth = date(430, '复兴纪元430年');
        nodes[2].birth = date(null, '原界早年'); nodes[2].death = date(null, '去向不详');
        edges.push(edge('body-parent', 'body-parent', 'focus', 'parent', '宿主父亲', 'body'),
          edge('origin-parent', 'origin-parent', 'focus', 'parent', '原身份母亲', 'soul'));
      } else {
        nodes[0].identity = { lineageKind: lineage, body: { world: '原界', birth: date(null, '穿越前约24年') }, arrival: date(480, '复兴纪元480年') };
        nodes[0].birth = date(null, '穿越前约24年');
        nodes.push(node('origin-parent', '原界父亲', -1, '父亲'));
        nodes[1].birth = date(null, '穿越前约50年');
        edges.push(edge('parent', 'origin-parent', 'focus', 'parent', '父亲', 'body'));
      }
      const result = { schema: 'eyon.genealogy.v2', requestId: 'preview-special-lineage', focusCharacterId: character.mvuId,
        focusCharacterName: character.name, depth: settings.genealogyDepth, nodes, edges,
        referenceSummary: { familyNames: [], knownResidences: ['王庭'], knownOrganizations: ['王庭档案馆'], brief: '王庭见证者的源流。' },
        qualityChecks: { focusIsMvuCharacter: true, generatedNodesHaveProvenance: true, allNodesHaveLifeDates: true,
          allNodesHaveBasicProfiles: true, noConflictNarrative: true } };
      previewGenealogies.push({ requestId: result.requestId, namespace: { characterKey: 'preview', chatId: 'preview-chat' }, createdAt: 1,
        input: { focusCharacter: character, depth: result.depth, lineageKind: 'auto' }, result,
        localView: { nodes, edges, units: nodes.map(item => ({ unitId: item.id, unitType: 'node', reusable: true, disposition: 'available' })) } });
    }
    const facade = {
      version: '0.14.14',
      getSettings: () => structuredClone(settings),
      updateSettings: patch => {
        Object.assign(settings, patch);
        if (patch.generation) Object.assign(settings.generation, patch.generation);
        return structuredClone(settings);
      },
      setGenerationSettings: (task, next) => {
        settings.generation[task] = structuredClone(next);
        return structuredClone(settings);
      },
      applyGenerationSettingsToAll: next => {
        for (const key of Object.keys(settings.generation)) {
          settings.generation[key] = structuredClone(next);
        }
        return structuredClone(settings);
      },
      setRuinDraft: input => {
        settings.ruinDraft = structuredClone(input);
        return structuredClone(settings);
      },
      getRuinRuntimeSnapshot: async () => structuredClone(runtime),
      listGenealogyCharacters: async () => [structuredClone(character)],
      listCharacterWorldbookEntries: async () => [],
      setCharacterWorldbookEntryEnabled: async () => [],
      setCharacterWorldbookEntriesEnabled: async () => [],
      generateGenealogy: async () => { throw new Error('预览页不调用生成 API'); },
      listGenealogies: async () => structuredClone(previewGenealogies),
      listRuinCharacterReferences: async () => [],
      toggleGenealogyNodeRuinReference: async () => [],
      removeRuinCharacterReference: async () => [],
      listRuinBiographyReferences: async () => [],
      toggleBiographyRuinReference: async () => [],
      removeRuinBiographyReference: async () => [],
      generateRuin: async () => { throw new Error('预览页不调用生成 API'); },
      listRuins: async () => [],
      listBiographies: async () => structuredClone(previewBiographyRecords),
      deleteBiography: async () => true,
      listButterflies: async () => [],
      listButterflyPending: async () => [],
      deleteButterfly: async () => true,
      fetchCustomApiModels: async () => [],
      inspectCurrentData: async () => ({
        namespace: { characterKey: 'preview', chatId: 'preview-chat' },
        checkedAt: new Date().toISOString(),
        counts: {
          biographies: previewBiographyRecords.length,
          genealogies: 0,
          ruins: 0,
          butterflies: 0,
          pendingButterflies: 0,
          ruinReferences: 0,
        },
        issues: [],
        healthy: true,
      }),
      exportCurrentData: async () => ({
        format: 'eyon-history-workbench-backup',
        schemaVersion: 1,
        workbenchVersion: '0.14.14',
        exportedAt: new Date().toISOString(),
        namespace: { characterKey: 'preview', chatId: 'preview-chat' },
        settings: structuredClone(settings),
        data: {
          biographies: structuredClone(previewBiographyRecords),
          genealogies: [],
          ruins: [],
          butterflies: [],
          pendingButterflies: [],
          ruinReferences: [],
        },
      }),
      clearGenerationCache: async () => {
        settings.ruinDraft = null;
        return { ruinDraftCleared: true, ruinReferencesCleared: 0 };
      },
      clearErrorLog: async () => 0,
      enterRuin: async () => undefined,
      getRuinTaskReview: async () => null,
      generateRuinTaskDraft: async () => { throw new Error('预览页不调用生成 API'); },
      updateRuinTaskDraft: async () => { throw new Error('预览页不写入任务'); },
      confirmRuinTaskDraft: async () => { throw new Error('预览页不写入任务'); },
      returnRuin: async () => undefined,
      retryButterfly: async () => undefined,
      dispose: () => undefined,
    };
    window.EyonHistoryWorkbench = facade;
    const previewView = previewParams.get('view');
    if (previewView) {
      document.querySelector('[data-eyon-workbench-shell]').dataset.initialView = previewView;
    }
    document.querySelector('[data-eyon-workbench-shell]').addEventListener(
      'eyon-history-workbench:close',
      () => { document.querySelector('[data-eyon-workbench-reopen]').style.display = 'block'; },
    );
    document.querySelector('[data-eyon-workbench-reopen]').addEventListener(
      'click',
      () => { document.querySelector('[data-eyon-workbench-reopen]').style.display = 'none'; },
    );
  </script>
  <script type="module" src="../dist/workbench.js?v=0.14.14"></script>
  <script type="module">
    // The preview must announce its mock facade after the production bundle has
    // installed its listeners. Keeping this page on the real bundle prevents a
    // second hand-written interface from drifting away from the packaged UI.
    const announceWorkbench = () => {
      window.dispatchEvent(new CustomEvent(
        'eyon-history-workbench:ready',
        { detail: window.EyonHistoryWorkbench },
      ));
      void window.EyonHistoryWorkbenchShell?.refresh();
      const requestedView = new URLSearchParams(location.search).get('view');
      if (requestedView) window.EyonHistoryWorkbenchShell?.navigate(requestedView);
    };
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', () => {
        window.setTimeout(announceWorkbench, 0);
      }, { once: true });
    } else {
      window.setTimeout(announceWorkbench, 0);
    }
  </script>
</body>
</html>
