<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>伊雍人物查看器 · 正式构建预览</title>
  <style>
    html {
      color-scheme: dark;
      background: #050809;
    }

    body {
      margin: 0;
      padding: 18px;
    }

    [data-eyon-character-viewer] {
      width: min(1500px, 100%);
      margin: 0 auto;
    }

    @media (max-width: 720px) {
      body {
        padding: 0;
      }
    }
  </style>
</head>
<body>
  <main data-eyon-character-viewer data-theme="dark"></main>
  <script>
    const previewRoot = document.querySelector('[data-eyon-character-viewer]');
    if (new URLSearchParams(location.search).get('theme') === 'light') {
      previewRoot.dataset.theme = 'light';
      document.documentElement.style.colorScheme = 'light';
      document.documentElement.style.background = '#f6f5f1';
    }

    const sourceCharacters = [
      {
        id: 'violetta',
        name: '维奥莱塔·马克西姆·奥古斯塔',
        data: {
          在场: false,
          种族: '人类',
          身份: ['奥古斯提姆帝国女皇', '大陆级称号：铁血女皇'],
          职业: ['统治者', '神话战士'],
          生命层级: '第六层级',
          等级: 24,
          命定契约: false,
          性格: '表面威严且从容，私下里却带着对亲密之人的些许依赖。涉及人类存续的底线时寸步不让。',
          喜爱: '特供红茶、《勇者丝特拉》特典绘本，以及沉重政务间隙难得的片刻安宁。',
          外貌: '棕红色长发与赤红眼瞳，身姿修长挺拔，常年的战斗赋予她匀称而有力的线条。',
          着装: '代表皇权的红白大衣或赤红精钢板甲。',
          心里话: '北境长垣的崩溃比预想得更快，必须尽快整合所有力量。',
          背景故事: '先帝牺牲后，她接过沉重的法则源质与皇位，以雷霆手段镇压旧贵族叛乱。',
        },
      },
      {
        id: 'eyon',
        name: '伊雍',
        data: {
          在场: true,
          种族: '精灵',
          身份: ['虚嗣王庭管理者', '历史调查者'],
          职业: ['同行者', '档案学者'],
          生命层级: '第五层级',
          等级: 21,
          命定契约: true,
          性格: '沉静、克制，对史料细节有近乎苛刻的耐心。',
          喜爱: '保存完好的旧纸、可靠的证词，以及被重新厘清的因果。',
          外貌: '黑发与幽青眼瞳，神情清冷，举止总带着王庭礼仪留下的分寸。',
          着装: '深色长衣与便于整理卷宗的轻质手套。',
          心里话: '这段历史仍缺少一份来自当事人的证词。',
          背景故事: '负责保管虚嗣王庭的历史档案，并陪同夜见哉川追索被遮蔽的因果。',
        },
      },
      {
        id: 'shuangzhi',
        name: '伊芙琳·霜枝',
        data: {
          在场: false,
          种族: '人类',
          身份: ['快乐教会高阶修女'],
          职业: ['神官', '炼金术士'],
          生命层级: '第四层级',
          等级: 17,
          命定契约: false,
          性格: '敏锐而偏执，习惯把温柔包装成控制。',
          喜爱: '旧式圣歌、炼金玻璃器皿与严密的名册。',
          外貌: '银灰长发，面容端丽，目光常停留在旁人不愿提及的细节上。',
          着装: '绣有霜枝纹章的修女长袍。',
          心里话: '档案里少掉的那一页，绝不能落在别人手里。',
          背景故事: '曾在教会南部支院主持圣液配额，并由此卷入夜川家系的旧案。',
        },
      },
      {
        id: 'ige',
        name: '伊伽',
        data: {
          在场: true,
          种族: '精灵',
          身份: ['夜见哉川的同行者'],
          职业: ['游侠', '斥候'],
          生命层级: '第四层级',
          等级: 16,
          命定契约: true,
          性格: '直率、警觉，愿意在危险里替同伴先迈一步。',
          喜爱: '林间清晨、锋利而趁手的短刃。',
          外貌: '身形轻捷，长耳尖端缀有细小银环。',
          着装: '便于潜行的软甲与短斗篷。',
          心里话: '不管那段过去藏着什么，至少别让他一个人面对。',
          背景故事: '从翡翠之心一路同行至金谷城，见证过数次墟境开启。',
        },
      },
      {
        id: 'glory',
        name: '格萝瑞·夜川',
        data: {
          在场: false,
          种族: '人类',
          身份: ['夜川家长女'],
          职业: ['医师', '庇护者'],
          生命层级: '第三层级',
          等级: 13,
          命定契约: false,
          性格: '坚韧而富有责任感，常把自己的损耗排在最后。',
          喜爱: '药草香气、妹妹们安稳的睡颜。',
          外貌: '深褐长发，神态温和，手指留有长期研磨药材的薄茧。',
          着装: '便于行动的旧长裙与药囊。',
          心里话: '只要她们能活下去，我付出什么都可以。',
          背景故事: '曾在教会清洗中保护两个妹妹穿过毒沼，因此成为夜川家系重要的历史锚点。',
        },
      },
    ];

    let hidden = new Set();
    let groups = [
      { id: 'focus', name: '重点溯源', characterIds: ['violetta', 'shuangzhi'], order: 0 },
      { id: 'ruin', name: '墟境关联', characterIds: ['eyon', 'ige'], order: 1 },
      { id: 'archive', name: '王庭档案', characterIds: [], order: 2 },
    ];

    const clone = value => JSON.parse(JSON.stringify(value));
    const catalog = () => ({
      characters: clone(sourceCharacters.filter(character => !hidden.has(character.id))),
      groups: clone(groups),
      hiddenCount: hidden.size,
      totalCount: sourceCharacters.length,
    });

    window.EyonHistoryWorkbench = {
      version: '0.10.0-internal-preview',
      getSettings: () => ({}),
      updateSettings: value => value,
      setGenerationSettings: () => ({}),
      applyGenerationSettingsToAll: () => ({}),
      setRuinDraft: () => ({}),
      generateGenealogy: async () => ({}),
      listGenealogies: async () => [],
      generateRuin: async () => ({}),
      listRuins: async () => [],
      listBiographies: async () => [],
      listButterflies: async () => [],
      getCharacterCatalog: async () => catalog(),
      hideCharacter: async characterId => {
        hidden.add(characterId);
        return catalog();
      },
      syncCharacters: async () => {
        hidden = new Set();
        return catalog();
      },
      createCharacterGroup: async name => {
        groups.push({
          id: `group-${Date.now()}`,
          name: name.trim(),
          characterIds: [],
          order: groups.length,
        });
        return catalog();
      },
      renameCharacterGroup: async (groupId, name) => {
        groups = groups.map(group => group.id === groupId
          ? { ...group, name: name.trim() }
          : group);
        return catalog();
      },
      deleteCharacterGroup: async groupId => {
        groups = groups.filter(group => group.id !== groupId);
        return catalog();
      },
      moveCharacterToGroup: async (characterId, groupId) => {
        groups = groups.map(group => ({
          ...group,
          characterIds: group.characterIds.filter(id => id !== characterId),
        }));
        if (groupId) {
          groups = groups.map(group => group.id === groupId
            ? { ...group, characterIds: [...group.characterIds, characterId] }
            : group);
        }
        return catalog();
      },
      enterRuin: async () => ({}),
      returnRuin: async () => ({}),
      retryButterfly: async () => ({}),
      dispose: () => {},
    };
  </script>
  <script type="module" src="../dist/character-viewer.js"></script>
</body>
</html>
